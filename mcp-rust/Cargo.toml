[package]
name = "falcon-mcp-rust"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "falcon-mcp-rust"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
base64 = "0.22"
bs58 = "0.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tower = { version = "0.5", features = ["util"] }

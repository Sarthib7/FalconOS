[package]
name = "falcon-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "falcon_engine"
path = "src/lib.rs"

[[bin]]
name = "falcon-engine"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "net", "io-util", "sync", "fs"] }

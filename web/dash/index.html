<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FalconOS dashboard access is reserved for the private preview.">
  <meta name="theme-color" content="#252a2b">
  <title>FalconOS Dashboard · Private preview</title>
  <style>
    :root { color-scheme: dark; --bg: #252a2b; --fg: #eef1ed; --muted: #aab3b1; --border: #4b5554; --accent: #8ee8d1; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(620px, calc(100% - 40px)); padding: 34px; border: 1px solid var(--border); }
    .eyebrow { color: var(--accent); font: 11px/1.2 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
    h1 { max-width: 12ch; margin: 18px 0 14px; font-size: clamp(42px, 8vw, 72px); line-height: 1.02; letter-spacing: -.04em; }
    p { max-width: 48ch; color: var(--muted); }
    a { color: var(--fg); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
    .soon { padding: 10px 13px; border: 1px solid var(--border); background: transparent; color: var(--muted); font: 11px ui-monospace, monospace; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">FalconOS / Private preview</p>
    <h1>Dashboard access is gated.</h1>
    <p>The public landing page shows a read-only market snapshot. Login, wallet connection, sign-up, and the full dashboard will open to approved members later.</p>
    <div class="actions">
      <a href="/">Return to FalconOS</a>
      <span class="soon">Login (Soon)</span>
      <span class="soon">Connect wallet (Soon)</span>
      <span class="soon">Sign up (Soon)</span>
    </div>
  </main>

</body>
</html>

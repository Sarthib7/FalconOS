name: Verify web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mesh/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install mesh dependencies used by the web build
        run: npm ci --prefix mesh

      - name: Run web tests
        run: npm --prefix web test

      - name: Run release boundary tests
        run: node --test scripts/test/release-boundaries.test.mjs

      - name: Verify production release boundaries
        run: node web/scripts/verify-release.mjs

      - name: Verify owner dashboard and retired human routes
        run: node --test web/test/mvp-routes.test.mjs
